name: ClipTown env audit consumer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cliptown-env-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIPTOWN_E2E_REF: cbaf34f6be575c94241270a7f69458d89c0af1f1
  ORES_SOPS_REF: f152c11f76cc14b2af440b47c756b6c97c0aa36b
  JUST_VERSION: 1.51.0
  JUST_LINUX_SHA256: c8f085ca3e885723c341d06243fc291b5abfdc8bbe3b2c076b117de490387b59

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out independent security suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: security-boundary-tests

      - name: Check out immutable ClipTown E2E candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cliptown/cliptown-e2e
          ref: ${{ env.CLIPTOWN_E2E_REF }}
          fetch-depth: 0
          persist-credentials: false
          path: cliptown-e2e

      - name: Check out immutable ores-sops helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ORESoftware/ores-sops
          ref: ${{ env.ORES_SOPS_REF }}
          persist-credentials: false
          path: ores-sops

      - name: Install checksum-verified just
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/just.tar.gz"
          curl --fail --show-error --silent --location \
            --output "${archive}" \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "${JUST_LINUX_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" just
          sudo install -m 0755 "${RUNNER_TEMP}/just" /usr/local/bin/just

      - name: Prove immutable source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C cliptown-e2e rev-parse HEAD)" = "${CLIPTOWN_E2E_REF}"
          test "$(git -C ores-sops rev-parse HEAD)" = "${ORES_SOPS_REF}"

      - name: Add ores-sops to PATH
        shell: bash
        run: printf '%s\n' "${GITHUB_WORKSPACE}/ores-sops" >> "${GITHUB_PATH}"

      - name: Run ClipTown keyless env audit
        shell: bash
        working-directory: cliptown-e2e
        run: just env-check
